<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Icon: Rotary Carousel & Optical Color Sensing -->
  <g transform="translate(140, 160)">
    <!-- Outer Conveyor Turntable Ring -->
    <circle r="95" fill="none" stroke="#1e293b" stroke-width="18"/>
    <circle r="95" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
    
    <!-- Inner Track -->
    <circle r="65" fill="#0b1120" stroke="#475569" stroke-width="2"/>

    <!-- Central 4-blade rotor -->
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>

    <!-- Packages on Track -->
    <!-- White package -->
    <rect x="-85" y="-12" width="22" height="24" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" transform="rotate(30 -74 0)"/>
    <!-- Brown package -->
    <rect x="62" y="-12" width="22" height="24" rx="3" fill="#b45309" stroke="#d97706" stroke-width="1.5" transform="rotate(210 73 0)"/>

    <!-- Optical Sensor Beam at 12 o'clock -->
    <polygon points="-18,-95 18,-95 28,-140 -28,-140" fill="#38bdf8" opacity="0.18"/>
    <rect x="-24" y="-145" width="48" height="15" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-10" cy="-138" r="2.5" fill="#ef4444"/>
    <circle cx="0" cy="-138" r="2.5" fill="#22c55e"/>
    <circle cx="10" cy="-138" r="2.5" fill="#3b82f6"/>

    <!-- Diverter Flaps at bottom right -->
    <g transform="rotate(50)">
      <line x1="65" y1="0" x2="115" y2="-20" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="65" cy="0" r="5" fill="#f43f5e"/>
    </g>
  </g>

  <!-- Typography / Branding -->
  <g transform="translate(310, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="320" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <circle cx="14" cy="13" r="4" fill="#10b981"/>
      <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5">EMBEDDED AUTOMATION SYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      AUTOMATED CONVEYOR-BASED
    </text>
    <text x="0" y="174" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      COLOR SORTING SYSTEM
    </text>

    <!-- Horizontal Divider -->
    <rect x="0" y="196" width="780" height="3" rx="1.5" fill="url(#accentGrad)"/>

    <!-- Subtitle / Meta -->
    <text x="0" y="232" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Closed-Loop Rotary Carousel with TCS3200 Optical Sensing &amp; Tri-Servo Diverter Actuation
    </text>

    <!-- Institution and Tech Badges -->
    <g transform="translate(0, 252)">
      <text x="0" y="15" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        Vellore Institute of Technology (VIT), Chennai &nbsp;|&nbsp; Arduino Uno R3 &nbsp;|&nbsp; ATmega328P
      </text>
    </g>
  </g>
</svg>
